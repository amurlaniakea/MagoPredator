name: CI
on: [push, pull_request]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LICENSE verbatim (661 líneas + sha256 canónico)
        run: |
          test "$(wc -l < LICENSE)" = "661"
          echo "0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0  LICENSE" | sha256sum -c -
      - name: Cabeceras SPDX presentes
        run: |
          grep -q "SPDX-License-Identifier: AGPL-3.0-or-later" index.html
          grep -q "SPDX-License-Identifier: AGPL-3.0-or-later" styles.css
          grep -q "SPDX-License-Identifier: AGPL-3.0-or-later" README.md
      - name: HTML parse válido + sin "Apache"/"MIT"
        run: python3 scripts/check_site.py
